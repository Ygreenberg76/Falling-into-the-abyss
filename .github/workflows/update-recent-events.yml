name: Refresh recently added timeline events
on:
  push:
    branches: [main, master]
    paths:
      - app.js
      - christianity.js
      - islam.js
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update ten-day banner manifest
        run: node scripts/update-recent-events.cjs
      - name: Commit updated manifest
        run: |
          if ! git diff --quiet -- recent-events-data.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add recent-events-data.js
            git commit -m "Automatically update recent timeline event banner"
            git push
          fi
